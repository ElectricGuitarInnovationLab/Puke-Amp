name: Build Puke Amp and Acoustic

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Plugins (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            artifact_name: Puke-Amp-Plugins-macOS
            artifact_path: NeuralAmpModeler/build-vst3/mac/Puke-Amp-*-macOS.zip
          - platform: Windows
            os: windows-latest
            artifact_name: Puke-Amp-Plugins-Windows
            artifact_path: |
              NeuralAmpModeler/build-vst3/windows/Puke-Amp-*-Windows*.zip
              NeuralAmpModeler/build-vst3/windows/Puke-Amp-*-Windows-Setup*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download VST3 SDK
        shell: bash
        working-directory: iPlug2/Dependencies/IPlug
        run: ./download-iplug-sdks.sh

      - name: Download iPlug2 prebuilt libraries
        shell: bash
        working-directory: iPlug2/Dependencies
        run: ./download-prebuilt-libs.sh

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not installed at $iscc"
          }

      - name: Build macOS plugins
        if: runner.os == 'macOS'
        shell: bash
        run: NeuralAmpModeler/scripts/make-vst3-mac.sh

      - name: Build Windows plugins and test installer
        if: runner.os == 'Windows'
        shell: cmd
        run: NeuralAmpModeler\scripts\make-vst3-win.bat

      - name: Upload packaged plugins
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
